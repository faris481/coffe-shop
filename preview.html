<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مقهى فنجان</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            direction: rtl;
            background-color: #f5f5f5;
        }

        header {
            background-color: #3e2723;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #5d4037;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd54f;
        }

        .hero {
            background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93') no-repeat center;
            background-size: cover;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        .section {
            padding: 40px;
            text-align: center;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        footer {
            background-color: #3e2723;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

<header>
    <h1>☕ مقهى فنجان</h1>

</header>

<nav>
    <a href="#">الرئيسية</a>
    <a href="#menu">المنيو</a>
    <a href="#about">عنّا</a>
    <a href="#contact">تواصل</a>

    استمتع بأجمل فنجان قهوة ☕
</div>

<div class="section" id="menu">
    <h2>المنيو</h2>
    <div class="menu">
        <div class="item">
            <h3>لاتيه</h3>
            <p>15 ريال</p>
        </div>
        <div class="item">
            <h3>كابتشينو</h3>
            <p>14 ريال</p>
        </div>
        <div class="item">
            <h3>اسبريسو</h3>
            <p>10 ريال</p>

    </div>
</div>

<div class="section" id="about">

<div class="section" id="contact">
    <h2>تواصل معنا</h2>
    <p>📍 الرياض</p>
    <p>📞 0500000000</p>
</div>

<footer>
    © 2026 جميع الحقوق محفوظة - مقهى فنجان
</footer>

</body>
</html>
